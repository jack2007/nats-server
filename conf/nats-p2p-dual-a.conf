# =============================================================================
# nats-p2p 双机部署参考配置 — 节点 A
# =============================================================================
#
# 用途
#   两台机器组成一个 NATS cluster，每台跑自己的 nats-p2p-server。
#   本文件给节点 A（示例：172.16.10.80，server_name=spark-1619）。
#   节点 B 用 conf/nats-p2p-dual-b.conf。
#
# 拓扑
#   Agent 可连任意一台的 :4222。Callout 发生在「接入那一台」：每台用本地
#   InProcessConn 订 $SYS.REQ.USER.AUTH，不要给该主题加 queue group。
#   占用跨节点时走 $P2P.MGR.* 两阶段，不需要 JetStream / 外部数据库。
#
# 二进制与启动
#   两侧都用包装进程：
#     节点 A: nats-p2p-server -c conf/nats-p2p-dual-a.conf
#     节点 B: nats-p2p-server -c conf/nats-p2p-dual-b.conf
#   启动顺序同单机：Start → ReadyForConnections → 本机 auth 订阅
#   → StartManager。两台都要先把 cluster route 打通再引流量。
#
# 两侧必须相同
#   - cluster.name
#   - authorization.auth_callout.issuer（= p2p.IssuerPublic()）
#   - auth-internal / p2p-internal 的用户名密码
#   - auth_users 列表
#   - p2p.agent_*（以及若启用：sys_*、stun/turn、secret_file）
#   - 代码常量（Agent 用户名密码、issuer 种子）——换二进制要两台一起换
#
# 两侧必须不同
#   - server_name（集群内唯一）
#   - cluster.routes（指向对端的 cluster 端口，不是自己）
#
# 鉴权模式（Auth Callout）
#   与单机相同：Agent CONNECT 由接入节点的同进程 auth 模块验密并回签 JWT。
#   必须写 authorization { auth_callout { ... } }，不要写顶层 auth {}。
#   Agent 凭据在 p2p/auth_callout.go 常量中，不要抄进本文件或静态 users。
#
# 本文件不要改的硬约束
#   1. issuer 必须等于 p2p.IssuerPublic()，否则 CheckIssuer 启动失败。
#   2. users / auth_users 只放进程内账号。不要放 Agent 账号。
#   3. 不要给 auth-internal / p2p-internal 加 permissions。
#      Callout 回包走 $SYS._INBOX.*，限制成 _INBOX.> 会导致全部 CONNECT
#      在 authorization.timeout 后失败。
#   4. p2p.agent_* 必须等于 p2p-internal。
#   5. 不要额外加残留 accounts { APP }（未设 agent_account 时 JWT 仍进 $G）。
#   6. 省略 ping_interval / ping_max 时包装进程套上 5s / 3。
#   7. cluster.routes 用 nats-route://对端IP:对端cluster端口。
#      不要写成 nats://（那是客户端口 4222）。
#
# 换机器时改什么
#   - 本机对外 IP 变了：改对端 dual-*.conf 里的 routes
#   - server_name：按主机名改，保持集群内不重复
#   - 示例 IP 172.16.10.80 / 172.16.10.81 只是实验室默认，按实际替换
#
# =============================================================================

# --- 监听（客户端面） ---
host: 0.0.0.0
# Agent 连本节点的 NATS 端口。两台可以都是 4222（各自本机）。
port: 4222
# 集群内唯一。节点 B 是 spark-1b6f，不要改成相同值。
server_name: spark-1619
max_payload: 2MB

# --- 集群（节点间 route，不是给 Agent 用的） ---
cluster {
  # 两台必须同名，否则形不成一个 cluster。
  name: nats-p2p-dgx
  # 本机接受对端 route 的端口。防火墙放行对端 → 本机 :6222。
  listen: 0.0.0.0:6222
  # 指向节点 B 的 cluster 口。IP 换成实际对端地址。
  routes: [
    nats-route://172.16.10.81:6222
  ]
}

# --- 鉴权：本机 Callout（每台各自订阅，不要 queue group） ---
authorization {
  # 本机 auth 未就绪或回包丢失时，客户端等这么久后收到 Authorization Violation。
  timeout: 2s

  # 仅进程内账号。两台密码必须一致，否则对端 InProcess 连得上、本机 auth 起不来。
  users: [
    # 本进程订 $SYS.REQ.USER.AUTH。用户名必须是 p2p.AuthInternalName。
    { user: auth-internal, password: "auth-internal" }
    # 本进程 P2P Manager。必须与 p2p.agent_* 一致。
    { user: p2p-internal, password: "p2p-internal" }
  ]

  auth_callout {
    # 两台同一把公钥，且等于 p2p.IssuerPublic()。不要写种子。
    issuer: "ABJHLOVMPA4CI6R5KLNGOB4GSLNIY7IOUPAJC4YFNDLQVIOBYQGUWVLA"
    auth_users: [ auth-internal, p2p-internal ]
  }
}

# --- P2P 段：包装进程解析，不传给内核 ---
p2p {
  agent_username: "p2p-internal"
  agent_password: "p2p-internal"

  # ----- 可选：断连释放（双机更建议打开，两侧同时改且凭据一致） -----
  # 打开后才能在「持有者连在 A、从 B 看占用」场景下，于 ping 窗口内释放。
  # 步骤（NATS 段 + p2p 段，A/B 两份 conf 一起改）：
  #   1) authorization 之前增加：
  #        accounts {
  #          SYS {
  #            users: [ { user: sys, password: "sys-internal" } ]
  #          }
  #        }
  #        system_account: SYS
  #   2) authorization.users 增加 { user: sys, password: "sys-internal" }
  #   3) auth_users 改为 [ auth-internal, p2p-internal, sys ]
  #   4) 取消下面两行注释
  # sys_username: "sys"
  # sys_password: "sys-internal"
  #
  # $P2P.MGR.* 两阶段协调在设了 sys_* 后走 system account，而不是 Agent 账号。

  # ----- 可选：STUN / TURN（两侧同一份 URL 与 secret_file） -----
  # 主机不能是环回；TURN 必须带 ?transport=udp。
  # secret 不可读时 invite 省略 turn，REGISTER/CREATE 仍可用。
  # stun_urls: ["stun:turn.example.com:3478"]
  # turn_urls: ["turn:turn.example.com:3478?transport=udp"]
  # secret_file: "/etc/nats/coturn-rest-secret"
  # credential_ttl: 24h
}
