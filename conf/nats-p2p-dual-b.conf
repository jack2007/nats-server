# =============================================================================
# nats-p2p 双机部署参考配置 — 节点 B
# =============================================================================
#
# 用途
#   与 conf/nats-p2p-dual-a.conf 组成同一 cluster。
#   本文件给节点 B（示例：172.16.10.81，server_name=spark-1b6f）。
#
# 拓扑
#   Agent 可连任意一台的 :4222。Callout 发生在接入节点本机，每台各自订
#   $SYS.REQ.USER.AUTH，不要加 queue group。跨节点占用走 $P2P.MGR.*。
#
# 二进制与启动
#     节点 A: nats-p2p-server -c conf/nats-p2p-dual-a.conf
#     节点 B: nats-p2p-server -c conf/nats-p2p-dual-b.conf
#   启动顺序：Start → ReadyForConnections → 本机 auth 订阅 → StartManager。
#
# 两侧必须相同
#   cluster.name、issuer、内部用户密码、auth_users、p2p.agent_*
#   （以及若启用：sys_*、stun/turn、secret_file）、同一套包装二进制常量。
#
# 两侧必须不同
#   server_name、cluster.routes（这里指向节点 A 的 :6222）。
#
# 鉴权模式（Auth Callout）
#   与单机 / 节点 A 相同。必须写 authorization { auth_callout { ... } }。
#   Agent 凭据在 p2p/auth_callout.go，不要抄进本文件或静态 users。
#
# 本文件不要改的硬约束
#   1. issuer 必须等于 p2p.IssuerPublic()。
#   2. users / auth_users 只放进程内账号，不要放 Agent 账号。
#   3. 不要给 auth-internal / p2p-internal 加 permissions（回包 $SYS._INBOX.*）。
#   4. p2p.agent_* 必须等于 p2p-internal。
#   5. 不要加残留 accounts { APP }。
#   6. 省略 ping_* 时包装进程套上 5s / 3。
#   7. routes 用 nats-route://对端IP:6222，不要写成客户端口 4222。
#
# 换机器时改什么
#   - 本机 IP 变了：改 dual-a.conf 的 routes
#   - 对端 IP 变了：改本文件 routes
#   - 示例 172.16.10.80 / 172.16.10.81 按实际替换
#
# =============================================================================

# --- 监听（客户端面） ---
host: 0.0.0.0
port: 4222
# 集群内唯一。节点 A 是 spark-1619，不要改成相同值。
server_name: spark-1b6f
max_payload: 2MB

# --- 集群（节点间 route） ---
cluster {
  # 必须与节点 A 同名。
  name: nats-p2p-dgx
  listen: 0.0.0.0:6222
  # 指向节点 A 的 cluster 口。IP 换成实际对端地址。
  routes: [
    nats-route://172.16.10.80:6222
  ]
}

# --- 鉴权：本机 Callout（每台各自订阅，不要 queue group） ---
authorization {
  timeout: 2s

  # 密码必须与节点 A 一致。
  users: [
    { user: auth-internal, password: "auth-internal" }
    { user: p2p-internal, password: "p2p-internal" }
  ]

  auth_callout {
    # 与节点 A、p2p.IssuerPublic() 同一把公钥。不要写种子。
    issuer: "ABJHLOVMPA4CI6R5KLNGOB4GSLNIY7IOUPAJC4YFNDLQVIOBYQGUWVLA"
    auth_users: [ auth-internal, p2p-internal ]
  }
}

# --- P2P 段：包装进程解析，不传给内核 ---
p2p {
  agent_username: "p2p-internal"
  agent_password: "p2p-internal"

  # ----- 可选：断连释放（必须与节点 A 同时打开、凭据相同） -----
  #   1) authorization 之前增加 accounts { SYS { users: [ { user: sys, password: "sys-internal" } ] } }
  #      以及 system_account: SYS
  #   2) authorization.users 增加 sys
  #   3) auth_users 改为 [ auth-internal, p2p-internal, sys ]
  #   4) 取消下面两行注释
  # sys_username: "sys"
  # sys_password: "sys-internal"

  # ----- 可选：STUN / TURN（与节点 A 同一份） -----
  # 主机不能是环回；TURN 必须带 ?transport=udp。
  # stun_urls: ["stun:turn.example.com:3478"]
  # turn_urls: ["turn:turn.example.com:3478?transport=udp"]
  # secret_file: "/etc/nats/coturn-rest-secret"
  # credential_ttl: 24h
}
