# =============================================================================
# nats-p2p 单机部署参考配置
# =============================================================================
#
# 用途
#   一台机器跑一个 nats-p2p-server。没有 cluster / route。所有 Agent 连本机
#   :4222。占用表只在本进程内存里，不需要 $P2P.MGR 两阶段。
#
# 二进制与启动
#   必须用包装进程，不要用上游 nats-server：
#     nats-p2p-server -c conf/nats-p2p-standalone.conf
#   包装进程会先剥掉顶层 p2p {}，再把剩余交给 server.ProcessConfigFile。
#   启动顺序：Start → ReadyForConnections → 本机订 $SYS.REQ.USER.AUTH
#   → StartManager。对外就绪以 auth 已订阅为准。
#
# 鉴权模式（Auth Callout）
#   Agent CONNECT 不再查静态 users 表。内核把 user/password 发到
#   $SYS.REQ.USER.AUTH，由同进程 auth 模块核对代码常量并回签 user JWT。
#   必须写标准块 authorization { auth_callout { ... } }，不要写顶层 auth {}。
#   没有 auth_callout 时包装进程不启 auth 协程，退回静态 users（实验室兼容）。
#   公网 / 正式部署必须带本文件这种 callout。
#
#   Agent 用户名密码是 p2p/auth_callout.go 里的临时常量，不要抄进本文件、
#   不要写进静态 users、不要打进日志。客户端从该常量或环境变量取值。
#
# 本文件不要改的硬约束
#   1. issuer 必须等于 p2p.IssuerPublic()（由代码内种子导出）。不一致则
#      CheckIssuer 启动失败。
#   2. users / auth_users 只放进程内账号（auth-internal、p2p-internal）。
#      不要放 Agent 账号。开 callout 后，不在 auth_users 里的静态用户也会
#      被送去 Callout。
#   3. 不要给 auth-internal（以及 p2p-internal）加 permissions。
#      内核 Callout 回包走 $SYS._INBOX.*（newRespInbox），不是 Agent JWT
#      里的 _INBOX.>。若只允许 publish: ["_INBOX.>"] 或只订
#      $SYS.REQ.USER.AUTH，应答被丢掉，合法凭据也会在 authorization.timeout
#      后变成 Authorization Violation。
#   4. p2p.agent_username / agent_password 必须等于 p2p-internal
#      （StartManager 的 InProcessConn）。
#   5. 不要额外加 accounts { APP { ... } }。残留 APP 且未设 agent_account
#      时，Agent JWT 仍进 $G；混配容易让占用表看错账号。
#   6. 省略 ping_interval / ping_max 时，包装进程套上 5s / 3。显式写出则
#      尊重运维值。
#
# 省略的可选能力（需要时再打开，见文件末尾注释块）
#   - system_account + sys_*：断连后从占用表释放 node_key（$SYS DISCONNECT）
#   - stun_urls / turn_urls / secret_file：CREATE invite 带 STUN/TURN 短时票
#
# =============================================================================

# --- 监听 ---
# 对所有网卡开放客户端口。只本机联调可改成 127.0.0.1。
host: 0.0.0.0
# Agent / 管理脚本连接的 NATS 端口。
port: 4222
# 集群内必须唯一；单机无 cluster 时仍建议设，便于日志与监控识别。
server_name: nats-p2p
# REGISTER / CREATE / ICE 信令足够；媒体不走 NATS。按需可再调大。
max_payload: 2MB

# --- 鉴权：进程内 Callout ---
authorization {
  # Callout 应答超时。auth 未订阅或回包被权限丢掉时，客户端在该时间后
  # 看到 Authorization Violation。2s 与测试夹具、设计规格一致。
  timeout: 2s

  # 静态 users 只给「绕过 Callout」的进程内连接。
  # 这两个用户不要加 permissions（见文件头第 3 条）。
  users: [
    # 包装进程在 ReadyForConnections 之后用 InProcessConn 订
    # $SYS.REQ.USER.AUTH。用户名必须是 p2p.AuthInternalName（auth-internal）。
    { user: auth-internal, password: "auth-internal" }
    # P2P Manager 的 InProcessConn。必须与下面 p2p.agent_* 完全一致。
    { user: p2p-internal, password: "p2p-internal" }
  ]

  auth_callout {
    # Account nkey 公钥（A 开头）。必须与 p2p.IssuerPublic() 逐字节相同。
    # 改种子后要同时改这里；不要把种子（S 开头）写进配置。
    issuer: "ABJHLOVMPA4CI6R5KLNGOB4GSLNIY7IOUPAJC4YFNDLQVIOBYQGUWVLA"
    # 这些用户 CONNECT 不走 Callout，否则 auth 会 Callout 自己或在订阅前死锁。
    auth_users: [ auth-internal, p2p-internal ]
  }
}

# --- P2P 段：包装进程解析，不会传给 nats-server 内核 ---
p2p {
  # StartManager 连本进程 NATS 的账号，必须已在 authorization.users
  # 且列入 auth_users。
  agent_username: "p2p-internal"
  agent_password: "p2p-internal"

  # ----- 可选：断连释放占用（生产建议打开） -----
  # 打开后，Agent TCP 断开约在 ping 窗口内触发 $SYS.ACCOUNT.*.DISCONNECT，
  # Manager 按 CONNECT name 释放 node_key。省略则只靠本连接生命周期，
  # 对端可能在 ping 超时前仍看到旧占用（node_key_in_use）。
  #
  # 打开步骤（本文件 NATS 段与 p2p 段一起改）：
  #   1) 在 authorization 之前增加：
  #        accounts {
  #          SYS {
  #            users: [ { user: sys, password: "sys-internal" } ]
  #          }
  #        }
  #        system_account: SYS
  #   2) authorization.users 增加 { user: sys, password: "sys-internal" }
  #   3) auth_users 改为 [ auth-internal, p2p-internal, sys ]
  #   4) 取消下面两行注释，密码与第 2 步相同
  # sys_username: "sys"
  # sys_password: "sys-internal"
  #
  # 若 Agent 不在默认 $G，再设 agent_account 为实际账号名。
  # 不要为了「隔离」再留一个残留 APP 账号却不设 agent_account。

  # ----- 可选：ICE 的 STUN / TURN（coturn 仍是独立进程） -----
  # 不配则 REGISTER/CREATE 仍可用，invite 不带 turn，也可不带 stun。
  # 校验规则：
  #   - STUN scheme 必须是 stun:
  #   - TURN scheme 必须是 turn:，且 query 必须含 transport=udp
  #   - 主机不得是 127.0.0.1 / ::1 / localhost，否则包装进程启动失败
  #   - secret_file 缺失或不可读：控制面仍启用，invite 省略 turn
  #   - 长期 secret 不要写进本文件、不要打日志、不要进 $SYS 业务事件
  # stun_urls: ["stun:turn.example.com:3478"]
  # turn_urls: ["turn:turn.example.com:3478?transport=udp"]
  # secret_file: "/etc/nats/coturn-rest-secret"
  # credential_ttl: 24h
}
